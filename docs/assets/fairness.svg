<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" role="img" aria-labelledby="t d">
  <title id="t">How the bake-off keeps it fair</title>
  <desc id="d">The same test for both loops. A, pydantic-ai, and B, our own loop, each talk to the same scripted fake model server, fakeprov, on 127.0.0.1: 22 scenarios, and each loop gets its own copy of the same script. What gets recorded: every request a loop sends, the session log and the git working copy. Both are judged the same way, from those recordings only: each scenario's checks and the invariants I1, I2, I3, I5 and I7, which give a pass or fail matrix (I6, no traffic beyond this machine, is enforced by a network guard instead). The rules from FAIRNESS.md: predictions were written in PREDICTIONS.md before either loop; A is used the way the pydantic-ai docs recommend, per A_CHECKLIST.md, which its reviewer can change; both loops have the same feature floor (retries, cost, cancel, approvals, crash resume), each covered by a test; and there is no automatic winner: the report shows evidence and people decide.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #FFFFFF; stroke: #D0D7DE; }
    .box   { fill: #F6F8FA; stroke: #8C959F; stroke-width: 1.2; }
    .card  { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.2; }
    .abox  { fill: #F3EFFD; stroke: #6A3FD1; stroke-width: 2; }
    .bbox  { fill: #E8F6F7; stroke: #0F7C86; stroke-width: 2; }
    .adot  { fill: #6A3FD1; }
    .bdot  { fill: #0F7C86; }
    .at    { fill: #6A3FD1; }
    .bt    { fill: #0F7C86; }
    .let   { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .h     { font-size: 14.5px; font-weight: 600; fill: #1F2328; }
    .s     { font-size: 12.5px; fill: #59636E; }
    .sec   { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; fill: #59636E; }
    .ok    { fill: #1A7F37; }
    .line  { stroke: #8C959F; stroke-width: 1.8; fill: none; }
    .head  { fill: #8C959F; }
    .div   { stroke: #D0D7DE; stroke-width: 1.2; stroke-dasharray: 6 6; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0D1117; stroke: #3D444D; }
      .box   { fill: #161B22; stroke: #6E7681; }
      .card  { fill: #0D1117; stroke: #3D444D; }
      .abox  { fill: #1D1633; stroke: #A48AF0; }
      .bbox  { fill: #0B2427; stroke: #3AB7C1; }
      .adot  { fill: #8B6CE8; }
      .bdot  { fill: #1C98A3; }
      .at    { fill: #B9A3F7; }
      .bt    { fill: #5CC8D1; }
      .h     { fill: #E6EDF3; }
      .s, .sec { fill: #9198A1; }
      .ok    { fill: #3FB950; }
      .line  { stroke: #6E7681; }
      .head  { fill: #6E7681; }
      .div   { stroke: #3D444D; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="879" height="403" rx="12"/>

  <text class="sec" x="24" y="32">THE SAME TEST FOR BOTH</text>

  <!-- the two loops -->
  <rect class="abox" x="24" y="44" width="166" height="48" rx="8"/>
  <circle class="adot" cx="50" cy="68" r="13"/>
  <text class="let" x="50" y="72.5" text-anchor="middle">A</text>
  <text class="h at" x="72" y="73">pydantic-ai</text>

  <rect class="bbox" x="24" y="108" width="166" height="48" rx="8"/>
  <circle class="bdot" cx="50" cy="132" r="13"/>
  <text class="let" x="50" y="136.5" text-anchor="middle">B</text>
  <text class="h bt" x="72" y="137">our own loop</text>

  <line class="line" x1="190" y1="68" x2="214" y2="68" marker-end="url(#ah)"/>
  <line class="line" x1="190" y1="132" x2="214" y2="132" marker-end="url(#ah)"/>

  <!-- fake model server -->
  <rect class="box" x="218" y="44" width="190" height="112" rx="8"/>
  <text class="h" x="236" y="70">Same fake model</text>
  <text class="s mono" x="236" y="94">fakeprov · 127.0.0.1</text>
  <text class="s" x="236" y="114">22 scripted scenarios</text>
  <text class="s" x="236" y="134">a fresh copy per loop</text>
  <line class="line" x1="408" y1="100" x2="430" y2="100" marker-end="url(#ah)"/>

  <!-- recorded -->
  <rect class="box" x="434" y="44" width="184" height="112" rx="8"/>
  <text class="h" x="452" y="70">Recorded</text>
  <text class="s" x="452" y="94">every request sent</text>
  <text class="s" x="452" y="114">the session log</text>
  <text class="s" x="452" y="134">the git working copy</text>
  <line class="line" x1="618" y1="100" x2="640" y2="100" marker-end="url(#ah)"/>

  <!-- judged -->
  <rect class="box" x="644" y="44" width="212" height="112" rx="8"/>
  <text class="h" x="662" y="70">Judged the same way</text>
  <text class="s" x="662" y="94">each scenario's checks</text>
  <text class="s" x="662" y="114">invariants I1–3, I5, I7</text>
  <text class="s" x="662" y="134">a pass / fail matrix</text>

  <line class="div" x1="24" y1="184" x2="856" y2="184"/>

  <text class="sec" x="24" y="212">AND THE RULES (FAIRNESS.md)</text>
  <rect class="card" x="24" y="224" width="408" height="62" rx="8"/>
  <circle class="ok" cx="48" cy="246" r="8"/><path d="M44.3,246.3 l2.5,2.5 l4.8,-5.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="66" y="251">Predictions first</text>
  <text class="s" x="66" y="271">PREDICTIONS.md was written before either loop</text>
  <rect class="card" x="448" y="224" width="408" height="62" rx="8"/>
  <circle class="ok" cx="472" cy="246" r="8"/><path d="M468.3,246.3 l2.5,2.5 l4.8,-5.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="490" y="251">A is used the way its docs recommend</text>
  <text class="s" x="490" y="271">A_CHECKLIST.md; its reviewer can change A</text>
  <rect class="card" x="24" y="298" width="408" height="62" rx="8"/>
  <circle class="ok" cx="48" cy="320" r="8"/><path d="M44.3,320.3 l2.5,2.5 l4.8,-5.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="66" y="325">Same feature floor</text>
  <text class="s" x="66" y="345">retries, cost, cancel, approvals, crash resume</text>
  <rect class="card" x="448" y="298" width="408" height="62" rx="8"/>
  <circle class="ok" cx="472" cy="320" r="8"/><path d="M468.3,320.3 l2.5,2.5 l4.8,-5.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="490" y="325">No automatic winner</text>
  <text class="s" x="490" y="345">the report shows evidence; people decide</text>

  <text class="s" x="440" y="388" text-anchor="middle">Pass or fail comes only from what was recorded, never from what a loop says about itself.</text>
</svg>
